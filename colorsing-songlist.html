<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ColorSing 音源リスト | YUPPI</title><style>body{margin:0;background:radial-gradient(ellipse at top,#383057,#100d22 65%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:960px;margin:auto;padding:24px}header,section{border:2px solid #c8a65c;border-radius:18px;background:#201b36;padding:20px;margin:18px 0}h1,a{color:#ffe0a0}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #c8a65c}input{width:min(90%,430px)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ffffff28}th{color:#ffe0a0}small{color:#ded3eb}@media(max-width:500px){main{padding:10px}td,th{padding:7px;font-size:14px}}</style><script async src="https://www.googletagmanager.com/gtag/js?id=G-6JZ773NN38"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-6JZ773NN38');</script></head><body><main><a href="./index.html">← YUPPI応援サイト</a><header><small>YUPPI MUSIC LIBRARY / TEST</small><h1>🎤 ColorSing カラオケ音源リスト</h1><p>公式追加楽曲情報からの抜粋です。全曲一覧ではありません。現在の利用可否はアプリで確認してください。</p><a href="https://faq.colorsing.com/276c1bbbc674806da82bf0e6a2b0fa51" target="_blank" rel="noopener">公式追加楽曲情報 ↗</a></header><section><label for="q">曲名・歌手名検索</label><br><input id="q" placeholder="曲名・歌手名"><button id="clear">クリア</button><p><label>追加年月 <select id="month"><option value="all">すべて</option><option value="2026-07">2026年7月</option></select></label> <label>並び順 <select id="sort"><option value="artist">歌手名</option><option value="song">曲名</option></select></label></p><p id="count" aria-live="polite"></p><table><thead><tr><th>歌手名</th><th>楽曲名</th><th>追加年月</th></tr></thead><tbody id="list"></tbody></table></section><footer><small>非公式検証ページ・2026年11月26日確認時に取得できた2026年7月公開情報の抜粋。音源そのものは提供しません。</small></footer></main><script>const data=[["i-dle","HIDE AND SEEK"],["アイドリング!!!","さよなら・またね・だいすき"],["IVE","Fashion"],["IVE","JIGSAW"],["IVE","LUCID DREAM"],["愛美","ドラマチック逃避行"],["ILLIT","Bubee"],["藍井エイル","絵空事"],["赤髪のとも","ダイヤモンド"],["AKASAKI","懐メロを抱えて"],["ASIAN KUNG-FU GENERATION","スキンズ"],["あたらよ","春となり"],["ASH DA HERO","BELIEVERS"],["Ado","エンゼルシーク"],["Ado","ビバリウム"],["ano","愛晩餐"],["阿部真央","Ding-dong"],["幾田りら","パズル"],["幾田りら","stay with me"],["King Gnu","CHAMELEON"],["桑田佳祐","人誑し / ひとたらし"],["西野カナ","君のせい"],["西野カナ","LOVE BEAT (feat. NiziU)"],["Vaundy","シンギュラリティ"],["Vaundy","The SILENCE"],["Vaundy","飛ぶ時"],["MISIA","夜を渡る鳥"],["MISIA","ラストダンスあなたと"],["Mr.Children","空也上人"],["Mr.Children","禁断の実"],["ヨルシカ","ポスト春"],["LiSA","シャドウ"],["LiSA","HOMEだよ"],["Little Glee Monster","一輪"]];const $=id=>document.getElementById(id);const norm=s=>s.normalize('NFKC').toLowerCase();function render(){const q=norm($('q').value.trim()),i=$('sort').value==='artist'?0:1;const a=data.filter(r=>norm(r.join(' ')).includes(q)).sort((a,b)=>a[i].localeCompare(b[i],'ja'));$('count').textContent=a.length+' / '+data.length+' 曲';$('list').replaceChildren();for(const r of a){const tr=document.createElement('tr');for(const v of [...r,'2026-07']){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('list').append(tr)}}$('q').oninput=render;$('month').onchange=render;$('sort').onchange=render;$('clear').onclick=()=>{$('q').value='';render()};render();</script></body></html>
