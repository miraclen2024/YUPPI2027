<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pocochaイベント情報 TEST | YUPPI</title><style>body{background:#15112c;color:#fff;font:16px system-ui,sans-serif;margin:0}main{max-width:940px;margin:auto;padding:22px}a{color:#ffe5a3}header,article{border:1px solid #9d8050;border-radius:16px;padding:18px;margin:14px 0;background:#241b40}h1,h2{color:#ffe5a3}label{display:inline-block;margin:8px}select{padding:9px;font:inherit}small,p{line-height:1.6}.tag{color:#ffd78c}dl{display:grid;grid-template-columns:auto 1fr;gap:8px}dd{margin:0}</style></head><body><main><a href="./index.html">← YUPPIトップ</a><header><small>TEST / 非公式</small><h1>🌙 Pococha イベント情報</h1><p>公式公開情報の収集テスト。全イベントを網羅していません。初期データは2026年11月26日確認の3件です。自動収集は未稼働です。</p><label>対象ランク <select id="rank"><option value="">すべて</option></select></label><label>開催状況 <select id="status"><option value="">すべて</option><option>開催予定</option><option>開催中</option><option>終了</option></select></label><label>対象月 <select id="month"><option value="">すべて</option></select></label></header><p id="count" aria-live="polite"></p><section id="list"></section><p>出典：Pococha公式イベントページ。最新情報は公式サイトで確認してください。</p></main><script>const events=[{"name":"ワンワン いぬプロフィール","entryStart":"2026-11-04T16:00","entryEnd":"2026-11-09T01:59","start":"2026-11-09T12:00","end":"2026-11-11T23:59","min":"D1","max":"S6","url":"https://event.pococha.com/ja-jp/festivals/dog_profile_1_001_225310"},{"name":"ぽこネクスト-池袋駅広告-","entryStart":"2026-10-01T16:00","entryEnd":"2026-10-08T01:59","start":"2026-10-09T12:00","end":"2026-10-13T23:59","min":"D1","max":"A3","url":"https://event.pococha.com/ja-jp/festivals/poconext_1_001_224400"},{"name":"ウトのもちもちクッション","entryStart":"2026-09-15T16:00","entryEnd":"2026-09-21T01:59","start":"2026-09-21T12:00","end":"2026-09-21T23:59","min":"D3","max":"S6","url":"https://event.pococha.com/ja-jp/festivals/uto_cushion_1_001_223240"}];const ranks=['E1',...['D','C','B','A'].flatMap(x=>[1,2,3].map(n=>x+n)),...Array.from({length:6},(_,i)=>'S'+(i+1))];const $=id=>document.getElementById(id);for(const r of ranks)$('rank').add(new Option(r,r));for(const m of [...new Set(events.map(e=>e.start.slice(0,7)))])$('month').add(new Option(m,m));const state=e=>Date.now()<Date.parse(e.start+'+09:00')?'開催予定':Date.now()<Date.parse(e.end+'+09:00')+60000?'開催中':'終了';const fmt=s=>s.replace('T',' ');function render(){const rows=events.filter(e=>(!$('rank').value||ranks.indexOf($('rank').value)>=ranks.indexOf(e.min)&&ranks.indexOf($('rank').value)<=ranks.indexOf(e.max))&&(!$('status').value||state(e)===$('status').value)&&(!$('month').value||e.start.startsWith($('month').value)));$('count').textContent=rows.length+'件';$('list').replaceChildren();for(const e of rows){const a=document.createElement('article');a.innerHTML='<small class="tag"></small><h2></h2><dl><dt>エントリ</dt><dd></dd><dt>開催期間</dt><dd></dd><dt>対象ランク</dt><dd></dd></dl><a target="_blank" rel="noopener noreferrer">公式詳細 ↗</a>';a.querySelector('small').textContent=state(e);a.querySelector('h2').textContent=e.name;const d=a.querySelectorAll('dd');d[0].textContent=fmt(e.entryStart)+' ～ '+fmt(e.entryEnd);d[1].textContent=fmt(e.start)+' ～ '+fmt(e.end);d[2].textContent=e.min+' ～ '+e.max;a.querySelector('a').href=e.url;$('list').append(a)}if(!rows.length)$('list').textContent='該当する取得済みイベントはありません。'}for(const id of ['rank','status','month'])$(id).addEventListener('change',render);$('rank').value='D2';render();</script></body></html>
