:#65594b;text-align:center;margin-top:26px}@media(max-width:600px){main{padding:12px}header{padding:26px 12px}header::before,header::after{font-size:22px;top:10px}label{display:flex;justify-content:space-between}article{padding:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}.event-hero{margin:16px 0 0;border:3px solid #d5ae54;border-radius:22px;overflow:hidden;box-shadow:0 8px 25px #ba8b3030}.event-hero img,.event-footer{display:block;width:100%;height:auto}.event-hero[hidden],.event-footer[hidden]{display:none}.event-footer{margin-top:24px;border-radius:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stats>div{padding:12px;text-align:center;border:3px double #c99b38;border-radius:14px;background:linear-gradient(#fff,#fff5db);box-shadow:0 4px 12px #b98a3020}.stats span,.stats strong{display:block}.stats span{font-size:13px}.stats strong{font-size:26px;color:#8b5a0b}.list-title{text-align:center;font-size:25px;color:#946419}.stats>div:nth-child(2) strong{color:#b53050}.stats>div:nth-child(3) strong{color:#1769ac}article{border-width:5px;box-shadow:0 6px 22px #b98a3026,inset 0 0 0 2px #e8c87b}article>a{background:linear-gradient(#fff7d0,#eec45c 48%,#d3a039 52%,#ffdf86);box-shadow:0 2px 5px #aa772e55}header{margin-top:12px;padding:18px}header h1,header .cheer{margin:6px 0}.event-hero:not([hidden])+header h1,.event-hero:not([hidden])+header .cheer{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.event-hero{border-radius:12px}}.event-footer{display:block;width:100%;height:clamp(88px,16vw,185px);object-fit:cover;object-position:center bottom;margin-top:12px;border-radius:12px}.event-footer[hidden]{display:none}#list+p{font-size:12px;line-height:1.6;text-align:center;margin:18px 0 8px;color:#65594b}@media(max-width:600px){.event-footer{height:clamp(65px,22vw,125px);margin-top:8px}}.event-footer{border:3px solid #d5ae54;box-shadow:0 8px 25px #ba8b3030,inset 0 2px 2px #fff5c69c,0 2px 0 #a77a28;border-radius:22px}@media(max-width:600px){.event-footer{border-radius:12px}}article[data-state="終了"]{background:linear-gradient(145deg,#fafafa,#efefef) padding-box,linear-gradient(125deg,#bcbcbc,#e7e7e7,#aaa,#e4e4e4) border-box;box-shadow:0 4px 12px #00000012,inset 0 0 0 1px #ddd;color:#626262}article[data-state="終了"] h2,article[data-state="終了"] dt{color:#626262}article[data-state="終了"] .tag{background:#e4e4e4;color:#555}article[data-state="終了"] a{background:linear-gradient(#fafafa,#ddd);border-color:#aaa;color:#555;box-shadow:none}article[data-state="終了"] .thumb{filter:grayscale(1)}</style><script async src="https://www.googletagmanager.com/gtag/js?id=G-6JZ773NN38"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-6JZ773NN38');</script></head><body><main><a href="./index.html">← YUPPIトップ</a><div class="event-hero"><img src="./assets/events/pococha-event-hero.webp" alt="Pococha イベント情報・夢に向かって、みんなで輝こう！" onerror="this.parentElement.hidden=true"></div><header><small>TEST / 非公式</small><h1>🏆 Pococha イベント情報</h1><p class="cheer">夢に向かって、みんなで輝こう！ ✨</p><p class="intro">公式公開情報の収集テスト。全イベントを網羅していません。過去6ヶ月～未来6ヶ月の取得済み情報を表示します。未発表・未取得のイベントは掲載されません。掲載情報は取得済みデータに基づきます。</p><label>対象ランク <select id="rank"><option value="">すべて</option></select></label><label>開催状況 <select id="status"><option value="">すべて</option><option>開催予定</option><option>開催中</option><option>終了</option></select></label><label>対象月 <select id="month"><option value="">すべて</option></select></label></header><div id="stats" class="stats" aria-label="イベント集計"></div><h2 class="list-title">♛　イベント一覧　♛</h2><p id="count" aria-live="polite"></p><section id="list"></section><p>出典：Pococha公式イベントページ。最新情報は公式サイトで確認してください。</p><img class="event-footer" src="./assets/events/pococha-event-footer.webp" alt="" onerror="this.hidden=true"></main><script>let events=[];const ranks=['E1',...['D','C','B','A'].flatMap(x=>[1,2,3].map(n=>x+n)),...Array.from({length:6},(_,i)=>'S'+(i+1))];const $=id=>document.getElementById(id);for(const r of ranks)$('rank').add(new Option(r,r));const now=new Date(Date.now()+9*3600000);const months=Array.from({length:13},(_,i)=>new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+i-6,1)).toISOString().slice(0,7));for(const m of months)$('month').add(new Option(m,m));const state=e=>Date.now()<Date.parse(e.start+(e.dateOnly?'T00:00':'')+'+09:00')?'開催予定':Date.now()<Date.parse(e.end+(e.dateOnly?'T23:59':'')+'+09:00')+60000?'開催中':'終了';const fmt=s=>s?s.replace('T',' '):'未確認';function render(){const totals=events.filter(e=>e.start&&months.includes(e.start.slice(0,7)));$('stats').replaceChildren();for(const [label,n] of [['登録イベント数',totals.length],...['開催中','開催予定','終了'].map(k=>[k,totals.filter(e=>state(e)===k).length])]){const b=document.createElement('div');const t=document.createElement('span');t.textContent=label;const v=document.createElement('strong');v.textContent=n+'件';b.append(t,v);$('stats').append(b)}const rows=events.filter(e=>e.start&&months.includes(e.start.slice(0,7))).filter(e=>(!$('rank').value||!e.min||!e.max||ranks.indexOf($('rank').value)>=ranks.indexOf(e.min)&&ranks.indexOf($('rank').value)<=ranks.indexOf(e.max))&&(!$('status').value||state(e)===$('status').value)&&(!$('month').value||e.start.startsWith($('month').value)));$('count').textContent=rows.length+'件';$('list').replaceChildren();for(const e of rows){const a=document.createElement('article');a.dataset.state=state(e);a.innerHTML='<div class="thumb" aria-label="イベント画像">🎁 サムネイル未取得</div><small class="tag"></small><h2></h2><dl><dt>エントリ</dt><dd></dd><dt>開催期間</dt><dd></dd><dt>対象ランク</dt><dd></dd></dl><a target="_blank" rel="noopener noreferrer">公式詳細 ↗</a>';if(e.thumbnail&&/^https:\/\//.test(e.thumbnail)){const img=document.createElement('img');img.alt=e.name;img.loading='lazy';img.onerror=()=>img.remove();img.src=e.thumbnail;a.querySelector('.thumb').append(img)}a.querySelector('small').textContent=state(e);a.querySelector('small').dataset.state=state(e);a.querySelector('h2').textContent=e.name;a.querySelector('small').textContent+=' / '+(e.source||'出典未確認');const d=a.querySelectorAll('dd');d[0].textContent=fmt(e.entryStart)+' ～ '+fmt(e.entryEnd);d[1].textContent=fmt(e.start)+' ～ '+fmt(e.end);d[2].textContent=e.min&&e.max?e.min+' ～ '+e.max:'未確認・対象条件は公式参照';a.querySelector('a').href=e.url;$('list').append(a)}if(!rows.length)$('list').textContent='該当する取得済みイベントはありません。'}for(const id of ['rank','status','month'])$(id).addEventListener('change',render);$('rank').value='';$('month').value=months[6];$('count').textContent='データ読み込み中…';fetch('./data/pococha/events.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{events=j.events;render();$('count').title='更新日 '+(j.updated||'未記録')}).catch(()=>{$('count').textContent='イベントデータの取得に失敗しました。'})</script></body></html>
