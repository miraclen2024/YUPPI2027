<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pocochaイベント情報 TEST | YUPPI</title><style>body{background:#15112c;color:#fff;font:16px system-ui,sans-serif;margin:0}main{max-width:940px;margin:auto;padding:22px}a{color:#ffe5a3}header,article{border:1px solid #9d8050;border-radius:16px;padding:18px;margin:14px 0;background:#241b40}h1,h2{color:#ffe5a3}label{display:inline-block;margin:8px}select{padding:9px;font:inherit}small,p{line-height:1.6}.tag{color:#ffd78c}dl{display:grid;grid-template-columns:auto 1fr;gap:8px}dd{margin:0}.thumb{position:relative;display:grid;place-items:center;min-height:100px;background:#33284c;color:#d8c9ed;border-radius:12px;margin-bottom:12px;overflow:hidden}.thumb img{position:absolute;width:100%;height:100%;object-fit:contain;background:#241b40}</style></head><body><main><a href="./index.html">← YUPPIトップ</a><header><small>TEST / 非公式</small><h1>🌙 Pococha イベント情報</h1><p>公式公開情報の収集テスト。全イベントを網羅していません。過去6ヶ月～未来6ヶ月の取得済み情報を表示します。未発表・未取得のイベントは掲載されません。自動収集は未稼働です。</p><label>対象ランク <select id="rank"><option value="">すべて</option></select></label><label>開催状況 <select id="status"><option value="">すべて</option><option>開催予定</option><option>開催中</option><option>終了</option></select></label><label>対象月 <select id="month"><option value="">すべて</option></select></label></header><p id="count" aria-live="polite"></p><section id="list"></section><p>出典：Pococha公式イベントページ。最新情報は公式サイトで確認してください。</p></main><script>let events=[];const ranks=['E1',...['D','C','B','A'].flatMap(x=>[1,2,3].map(n=>x+n)),...Array.from({length:6},(_,i)=>'S'+(i+1))];const $=id=>document.getElementById(id);for(const r of ranks)$('rank').add(new Option(r,r));const now=new Date(Date.now()+9*3600000);const months=Array.from({length:13},(_,i)=>new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+i-6,1)).toISOString().slice(0,7));for(const m of months)$('month').add(new Option(m,m));const state=e=>Date.now()<Date.parse(e.start+'+09:00')?'開催予定':Date.now()<Date.parse(e.end+'+09:00')+60000?'開催中':'終了';const fmt=s=>s?s.replace('T',' '):'未確認';function render(){const rows=events.filter(e=>months.includes(e.start.slice(0,7))).filter(e=>(!$('rank').value||ranks.indexOf($('rank').value)>=ranks.indexOf(e.min)&&ranks.indexOf($('rank').value)<=ranks.indexOf(e.max))&&(!$('status').value||state(e)===$('status').value)&&(!$('month').value||e.start.startsWith($('month').value)));$('count').textContent=rows.length+'件';$('list').replaceChildren();for(const e of rows){const a=document.createElement('article');a.innerHTML='<div class="thumb" aria-label="イベント画像">🎁 サムネイル未取得</div><small class="tag"></small><h2></h2><dl><dt>エントリ</dt><dd></dd><dt>開催期間</dt><dd></dd><dt>対象ランク</dt><dd></dd></dl><a target="_blank" rel="noopener noreferrer">公式詳細 ↗</a>';if(e.thumbnail&&/^https:\/\//.test(e.thumbnail)){const img=document.createElement('img');img.alt=e.name;img.loading='lazy';img.onerror=()=>img.remove();img.src=e.thumbnail;a.querySelector('.thumb').append(img)}a.querySelector('small').textContent=state(e);a.querySelector('h2').textContent=e.name;const d=a.querySelectorAll('dd');d[0].textContent=fmt(e.entryStart)+' ～ '+fmt(e.entryEnd);d[1].textContent=fmt(e.start)+' ～ '+fmt(e.end);d[2].textContent=e.min+' ～ '+e.max;a.querySelector('a').href=e.url;$('list').append(a)}if(!rows.length)$('list').textContent='該当する取得済みイベントはありません。'}for(const id of ['rank','status','month'])$(id).addEventListener('change',render);$('rank').value='';$('count').textContent='データ読み込み中…';fetch('./data/pococha/events.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{events=j.events;render()}).catch(()=>{$('count').textContent='イベントデータの取得に失敗しました。'})</script></body></html>
