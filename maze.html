<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YUPPI GALAXY MAZE</title><script async src="https://www.googletagmanager.com/gtag/js?id=G-6JZ773NN38"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-6JZ773NN38')</script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#49346d,#100b25);color:#ffe9ad;font-family:system-ui;text-align:center}main{max-width:530px;margin:auto;padding:10px}a{color:#ffe9ad}canvas{display:block;width:100%;max-height:62vh;object-fit:contain;border:2px solid #d9b76b;border-radius:12px}h1{font-size:clamp(20px,5vw,30px)}button{background:#65458c;color:white;border:1px solid #e3bd70;border-radius:12px;font:bold 16px system-ui;touch-action:none;user-select:none;min-height:46px}.pad{display:flex;align-items:center;justify-content:space-between;max-width:350px;margin:12px auto}.cross{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px}.action{width:84px;height:84px;border-radius:50%;background:#a34c86}p{font-size:13px}</style></head><body><main><a href="./index.html">← トップ</a>　<a href="./game.html">アクション</a>　<a href="./shooter.html">お宝集め</a><h1>🐹 YUPPI GALAXY MAZE 🌙</h1><div id="hud"></div><canvas width="450" height="450"></canvas><div class="pad"><div class="cross"><button style="grid-area:1/2" data-d="0">▲</button><button style="grid-area:2/1" data-d="1">◀</button><button style="grid-area:2/3" data-d="2">▶</button><button style="grid-area:3/2" data-d="3">▼</button></div><button class="action" id="action">決定</button></div><p>矢印キー／十字ボタンで移動。決定／Spaceで開始・次へ・一時停止。月を取ると敵を撃退できるよ！</p><footer>© 2026 YUPPI LIVE</footer></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),hud=document.querySelector('#hud'),D=[[0,-1],[-1,0],[1,0],[0,1]],N=15,T=30;let map,p,enemies,score=0,lives=3,stage=1,mode='ready',power=0,grace=0,want=2,dir=2,remaining=0,tick=0;
function init(){map=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x===0||y===0||x===14||y===14||(x%2===0&&y%2===0)?'#':'.'));for(let y=2;y<14;y+=4)for(let x=3;x<13;x+=4)map[y][x]='#';for(let x=2;x<14;x+=4)for(let y=3;y<13;y+=4)map[y][x]='#';for(const [x,y] of [[1,1],[13,1],[1,13],[13,13]])map[y][x]='o';p={x:7,y:13};map[p.y][p.x]=' ';enemies=Array.from({length:stage+1},(_,i)=>({x:3+i*2,y:1,dir:3,wait:0}));remaining=map.flat().filter(v=>v==='.'||v==='o').length;power=0;grace=12;want=dir=2;tick=0}
function can(a,d){let [x,y]=D[d];return map[a.y+y]?.[a.x+x]!==undefined&&map[a.y+y][a.x+x]!=='#'}function move(a,d){a.x+=D[d][0];a.y+=D[d][1]}function action(){if(mode==='play'){mode='pause';return}if(mode==='pause'){mode='play';return}if(mode==='clear'&&stage<3)stage++;else{stage=1;score=0;lives=3}init();mode='play';gtag('event','game_start',{game:'galaxy_maze',stage})}
function step(){if(mode!=='play')return;tick++;if(power>0)power--;if(grace>0)grace--;if(can(p,want))dir=want;if(can(p,dir))move(p,dir);let v=map[p.y][p.x];if(v==='.'||v==='o'){score+=v==='o'?50:10;remaining--;map[p.y][p.x]=' ';if(v==='o')power=55}if(!remaining){score+=1000;mode='clear';gtag('event','game_clear',{game:'galaxy_maze',stage,score});return}function hit(){for(const e of enemies){if(e.x!==p.x||e.y!==p.y||e.wait>0)continue;if(power){score+=200;e.x=7;e.y=1;e.wait=12}else if(!grace){lives--;if(!lives){mode='over';gtag('event','game_over',{game:'galaxy_maze',score});return}p.x=7;p.y=13;grace=15;return}}}hit();if(mode!=='play')return;for(const e of enemies){if(e.wait>0){e.wait--;continue}if(tick%(stage===3?3:4)===0)continue;let opts=[0,1,2,3].filter(d=>can(e,d));let rev=[3,2,1,0][e.dir];if(opts.length>1)opts=opts.filter(d=>d!==rev);if(!opts.length)continue;opts.sort((a,b)=>{let dist=d=>Math.abs(e.x+D[d][0]-p.x)+Math.abs(e.y+D[d][1]-p.y);return power?dist(b)-dist(a):dist(a)-dist(b)});e.dir=Math.random()<.22?opts[Math.floor(Math.random()*opts.length)]:opts[0];move(e,e.dir)}hit()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function box(x,y){g.fillStyle='#b76bce';g.fillRect(x-6,y-5,12,11);g.fillStyle='#ffb8dc';g.fillRect(x-7,y-7,14,5);g.fillStyle='#ffe48a';g.fillRect(x-1,y-7,2,13);circle(x-3,y+1,1,'#57335e');circle(x+3,y+1,1,'#57335e')}
function draw(){g.fillStyle='#100b25';g.fillRect(0,0,450,450);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let a=x*T,b=y*T,v=map[y][x];if(v==='#'){g.fillStyle='#39296c';g.fillRect(a+1,b+1,28,28);g.strokeStyle='#9578d5';g.strokeRect(a+2,b+2,26,26)}else if(v==='.')box(a+15,b+15);else if(v==='o'){circle(a+15,b+15,11,'#ffe49b');circle(a+20,b+10,9,'#100b25')}}for(const [i,e] of enemies.entries()){let x=e.x*T+15,y=e.y*T+15;circle(x,y,12,power?'#6db8ee':['#e88cb8','#9a83df','#f5a36b','#68c7b3'][i]);circle(x-7,y-9,5,'#e9b2d4');circle(x+7,y-9,5,'#e9b2d4');circle(x-4,y,2,'#30203e');circle(x+4,y,2,'#30203e')}let x=p.x*T+15,y=p.y*T+15;if(!grace||tick%2===0){circle(x-8,y-9,5,'#f3c88f');circle(x+8,y-9,5,'#f3c88f');circle(x,y,12,'#f3c88f');circle(x,y+4,7,'#fff1d0');circle(x-4,y-2,2,'#432b37');circle(x+4,y-2,2,'#432b37');circle(x,y+2,2,'#e883a6')}hud.textContent='STAGE '+stage+'/3　 SCORE '+score+'　残機 '+lives+'　残り '+remaining+(power?'　POWER!':'');if(mode!=='play'){g.fillStyle='#100b25dd';g.fillRect(0,0,450,450);g.fillStyle='#ffe9ad';g.textAlign='center';g.font='bold 30px system-ui';g.fillText({ready:'GALAXY MAZE',pause:'PAUSE',clear:stage===3?'ALL CLEAR!':'STAGE CLEAR!',over:'GAME OVER'}[mode],225,205);g.font='17px system-ui';g.fillText('決定ボタンで進む',225,245)}}init();const keys={ArrowUp:0,ArrowLeft:1,ArrowRight:2,ArrowDown:3};addEventListener('keydown',e=>{if(e.key in keys){e.preventDefault();want=keys[e.key]}else if(e.code==='Space'){e.preventDefault();if(!e.repeat)action()}});document.querySelectorAll('[data-d]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();want=Number(b.dataset.d)});document.querySelector('#action').onclick=action;setInterval(()=>{step();draw()},145);draw();
</script></body></html>
