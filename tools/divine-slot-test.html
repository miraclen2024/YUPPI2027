7],[3,5,1],[5,5,5]];function reset(){timers.forEach(clearInterval);timers=[null,null,null];reels.forEach((r,i)=>{r.textContent='7';r.classList.remove('spin');stops[i].disabled=true});start.disabled=false;cab.classList.remove('flash');msg.textContent='STARTでリール演出を確認';round=0}start.onclick=()=>{start.disabled=true;cab.classList.remove('flash');msg.textContent='各STOPボタンで数字を停止';reels.forEach((r,i)=>{let n=i;r.classList.add('spin');timers[i]=setInterval(()=>{r.textContent=1+(n++%8)},85+i*12);stops[i].disabled=false})};stops.forEach((b,i)=>b.onclick=()=>{clearInterval(timers[i]);timers[i]=null;b.disabled=true;reels[i].classList.remove('spin');reels[i].textContent=patterns[round%patterns.length][i];if(timers.every(t=>t===null)){const same=reels.every(r=>r.textContent===reels[0].textContent);msg.textContent=same?'✦ 数字揃い演出 ✦':'リール停止完了';cab.classList.toggle('flash',same);round++;start.disabled=false}});document.getElementById('reset').onclick=reset;</script></body></html>
