<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>API接続テスト</title><style>body{font:16px system-ui;background:#171331;color:#fff;max-width:850px;margin:30px auto;padding:16px}button,select{font:inherit;padding:10px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#302448;padding:16px}a{color:#ffe7aa}</style><script async src="https://www.googletagmanager.com/gtag/js?id=G-6JZ773NN38"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-6JZ773NN38');</script></head><body><h1>ランクメーター API接続テスト v2</h1><p>ブラウザからの接続確認のみ。データの保存・転載は行いません。</p><label>対象月 <select id="month"><option>7</option><option>8</option><option>9</option><option>10</option><option selected>11</option></select></label> <button id="run">3種類の締め時間をテスト</button><pre id="out" aria-live="polite">ボタンを押してください。</pre><a href="../rankmeter.html">ランクメーターへ戻る</a><script>document.getElementById('run').onclick=async function(){const btn=this;btn.disabled=true;const out=document.getElementById('out'),month=document.getElementById('month').value;const times=[13,22,24],results=times.map(t=>t+'時締め：確認中');const render=()=>out.textContent=results.join('\n\n');render();await Promise.all(times.map(async(t,i)=>{let timer;const c=new AbortController();try{const task=async()=>{const u=new URL('https://haishin-lab.com/wp-json/haishin-lab/v1/rank-borders');u.search=new URLSearchParams({year:'2026',month,close_time:String(t),sub_meter:'0'});const res=await fetch(u,{mode:'cors',credentials:'omit',signal:c.signal});if(!res.ok)throw Error('HTTP '+res.status);const j=await res.json();if(j.success!==true||!Array.isArray(j.data))throw Error('JSON形式不一致');if(!j.data.every(x=>x.year===2026&&x.month===Number(month)&&x.close_time===t&&x.sub_meter===0&&x.borders))throw Error('応答条件不一致');return '成功：HTTP '+res.status+' / '+j.data.length+'件'};results[i]=t+'時締め：'+await Promise.race([task(),new Promise((_,reject)=>{timer=setTimeout(()=>{reject(Error('10秒タイムアウト'));c.abort()},10000)})])}catch(e){results[i]=t+'時締め：失敗 / '+e.message+'（CORS・通信障害等の可能性）'}finally{clearTimeout(timer);render()}}));out.textContent+='\n\nテスト終了';btn.disabled=false}</script></body></html>
