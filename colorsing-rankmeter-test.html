<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ColorSing ボーダー管理表・検証版</title><style>body{background:#171328;color:#fff;font:16px system-ui;margin:0}main{max-width:960px;margin:auto;padding:24px}h1,h2,a{color:#f5d58c}section{border:1px solid #c6a45a;border-radius:16px;padding:16px;margin:18px 0;background:#25203b}select{padding:10px;margin:5px;background:#fff;color:#222}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:center;border-bottom:1px solid #ffffff22}svg{width:100%;height:auto}small{color:#ddd}</style><main><a href="./index.html">← トップ</a><h1>ColorSing ボーダー管理表（検証版）</h1><section>過去データの参考表示です。原表との再照合未完了です。最新実績ではありません。保証値と締め後確定値は別物です。未取得値は「—」で表示します。</section><section><label>区分 <select id="kind"><option value="g">保証値</option><option value="b">ボーダー確定値</option></select></label><label>対象月 <select id="month"><option>2026-03</option><option>2026-11</option><option>2025-06</option></select></label><label>リーグ <select id="league"></select></label><p id="status"></p></section><section><h2>日別推移（K）</h2><svg id="graph" viewBox="0 0 340 140" role="img" aria-label="保証値の日別推移"></svg></section><section><h2>日別一覧（K）</h2><table><thead><tr><th>日付</th><th>＋1</th><th>＋2</th><th>＋3</th></tr></thead><tbody id="rows"></tbody></table></section><section>出典：<a href="https://note.com/natsuki8724/n/n661ece73b779">natsu氏・2026年3月保証値実績</a>／<a href="https://docs.google.com/spreadsheets/d/16ne2xv4vk7Z0OJ5Jk6I89CKzxvChmgFcaJJ9dyGqkjk/edit">公開原表</a>。表示は原表の＋1の部分採取のみ。＋2・＋3および確定値は原表再取得待ち。<br><a href="https://faq.colorsing.com/fd4160cb484a4b4299483a789eccdcb9">公式仕様</a></section><section><h2>接続診断</h2><p>公開ページへの読取専用GETを試行します。APIは未特定です。CORSによる取得不可とサーバ停止は区別できない場合があります。過去の掲載値は原表再照合未完了のため参考扱いです。</p><button id="probe" type="button">接続試験を実行</button><div id="results" aria-live="polite"></div></section><script>document.getElementById('probe').onclick=async()=>{const b=document.getElementById('probe'),r=document.getElementById('results');b.disabled=true;r.replaceChildren();for(const [name,url] of [['公式FAQ','https://faq.colorsing.com/fd4160cb484a4b4299483a789eccdcb9'],['Webプロフィール','https://web.colorsing.com/share/user?user_id=8766f3e8-375c-4dbd-8672-532dbe61a744'],['確定値原表','https://docs.google.com/spreadsheets/d/1yek6H9WdLI7_BITOLuv9URAQcD6MBQfMIEkfeocfhZY/edit'],['保証値原表','https://docs.google.com/spreadsheets/d/16ne2xv4vk7Z0OJ5Jk6I89CKzxvChmgFcaJJ9dyGqkjk/edit']]){const p=document.createElement('p');p.textContent=name+'：試験中';r.append(p);const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const res=await fetch(url,{credentials:'omit',signal:c.signal,cache:'no-store'});p.textContent=name+'：HTTP '+res.status+'（メーターAPI確認なし）'}catch(e){p.textContent=name+'：取得不可（CORS・通信制限・タイムアウト等）'}finally{clearTimeout(t)}}b.disabled=false}</script></main><script>const obs={"1":[0.368,0.399,0.395,0.398,0.395,0.389,0.404,0.398,0.402,0.369,0.395,0.382,0.389,0.367,0.383,0.404,0.389,0.393,0.367,0.394,0.392,0.382,0.405,0.367,0.387,0.378,0.397,0.367,0.396,0.392,0.382],"20":[6.1,6.6,6.6,6.6,6.6,6.5,6.7,6.6,6.7,6.1,6.6,6.3,6.5,6.1,6.4,6.7,6.5,6.5,6.1,6.5,6.5,6.3,6.7,6.1,6.4,6.3,6.6,6.1,6.6,6.5,6.3],"30":[12.8,13.9,13.7,13.9,13.7,13.5,14.1,13.9,14,12.8,13.8,13.3,13.5,12.8,13.3,14.1,13.5,13.7,12.8,13.7,13.6,13.3,14.1,12.8,13.5,13.2,13.8,12.8,13.8,13.6,13.3],"32":[14.4,15.6,15.5,15.6,15.4,15.2,15.8,15.6,15.7,14.4,15.5,14.9,15.2,14.4,15,15.8,15.2,15.4,14.4,15.4,15.3,15,15.9,14.4,15.2,14.8,15.5,14.4,15.5,15.3,15],"40":[24.9,27,26.7,26.9,26.6,26.2,27.3,26.9,27.1,24.9,26.7,25.8,26.3,24.8,25.8,27.3,26.2,26.6,24.8,28.6,26.4,25.8,27.3,24.8,26.1,25.5,26.8,24.8,26.7,26.4,25.8]};const $=id=>document.getElementById(id);for(let i=1;i<=100;i++)$('league').add(new Option(i,i));$('league').value='30';function render(){const m=$('month').value,l=$('league').value,v=m==='2026-03'&&$('kind').value==='g'?obs[l]:null;const [y,n]=m.split('-').map(Number),days=new Date(y,n,0).getDate();$('status').textContent=v?'31日分・＋1のみ':'選択条件のデータは未取得';$('rows').innerHTML=Array.from({length:days},(_,i)=>'<tr><td>'+n+'/'+(i+1)+'</td><td>'+(v?.[i]??'—')+'</td><td>—</td><td>—</td></tr>').join('');$('graph').innerHTML=v?'<path d="M25 10V115H330" fill="none" stroke="#888"/><polyline fill="none" stroke="#f5d58c" stroke-width="2" points="'+v.map((x,i)=>(25+i*10)+','+(115-x/Math.max(...v)*95)).join(' ')+'"/><text x="30" y="135" fill="white" font-size="10">1日</text><text x="300" y="135" fill="white" font-size="10">31日</text><text x="28" y="12" fill="white" font-size="10">'+Math.max(...v)+'K</text>':'<text x="170" y="70" text-anchor="middle" fill="white" font-size="12">未取得</text>'}for(const id of ['month','league','kind'])$(id).onchange=render;render();</script></html>
