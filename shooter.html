const c=document.querySelector('canvas'),g=c.getContext('2d'),hud=document.querySelector('#hud'),K={};let p,air,ground,shots,bombs,hostile,score,lives,t,mode='ready',cool,bc,inv,boss,spawn,last=0;function reset(){p={x:240,y:550};air=[];ground=[];shots=[];bombs=[];hostile=[];score=0;lives=3;t=0;cool=bc=inv=spawn=0;boss=null;mode='play'}reset();mode='ready';const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),near=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;function end(win){mode=win?'clear':'over';gtag('event',win?'game_clear':'game_over',{game:'shooter',score})}function damage(){if(inv>0)return;lives--;inv=120;if(lives<=0)end(false)}function step(d){if(mode!=='play')return;t+=d;cool-=d;bc-=d;inv-=d;p.x=clamp(p.x+((K.right?1:0)-(K.left?1:0))*5*d,18,462);p.y=clamp(p.y+((K.down?1:0)-(K.up?1:0))*5*d,30,615);if(K.fire&&cool<=0){shots.push({x:p.x,y:p.y-20});cool=8}if(K.bomb&&bc<=0){bombs.push({x:p.x,y:p.y-100,life:30});bc=35}spawn+=d;if(spawn>48&&t<3000){spawn=0;air.push({x:35+Math.random()*410,y:-25,hp:1,phase:Math.random()*6,fire:50+Math.random()*70});if(Math.random()<.65)ground.push({x:40+Math.random()*400,y:-25,hp:1})}if(t>=3000&&!boss)boss={x:240,y:-70,hp:45,fire:0};for(const e of air){e.y+=2.1*d;e.x+=Math.sin(t*.04+e.phase)*1.8*d;e.fire-=d;if(e.fire<=0){e.fire=110;hostile.push({x:e.x,y:e.y,vx:(p.x-e.x)*.008,vy:3.2})}if(near(e,p,25)){e.hp=0;damage()}}for(const e of ground)e.y+=1.3*d;if(boss&&boss.hp>0){boss.y=Math.min(110,boss.y+d);boss.x=240+Math.sin(t*.017)*145;boss.fire-=d;if(boss.fire<=0){boss.fire=34;for(let i=-2;i<=2;i++)hostile.push({x:boss.x,y:boss.y+25,vx:i*1.3,vy:3.5})}}for(const s of shots){s.y-=10*d;for(const e of air)if(e.hp>0&&near(s,e,20)){e.hp=0;s.y=-100;score+=100;break}if(boss&&boss.hp>0&&near(s,boss,48)){boss.hp--;s.y=-100;score+=20;if(!boss.hp){score+=5000;end(true)}}}for(const b of bombs){b.life-=d;b.y+=1.3*d;if(b.life<=15)for(const e of ground)if(e.hp>0&&near(b,e,48)){e.hp=0;score+=250}}for(const h of hostile){h.x+=h.vx*d;h.y+=h.vy*d;if(near(h,p,17)){h.y=9 function poly(x,y,pts,color){g.fillStyle=color;g.beginPath();pts.forEach(([a,b],i)=>i?g.lineTo(x+a,y+b):g.moveTo(x+a,y+b));g.closePath();g.fill()}function draw(){g.fillStyle='#122b35';g.fillRect(0,0,480,640);for(let i=0;i<30;i++){let y=(i*97+t*1.3)%740-50,x=(i*137)%480;g.fillStyle=i%3?'#21473e':'#35594a';g.beginPath();g.ellipse(x,y,40+i%5*12,60,i,0,7);g.fill()}g.strokeStyle='#6b857544';for(let y=t%64;y<640;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(480,y);g.stroke()}for(const e of ground){g.fillStyle='#c49b62';g.fillRect(e.x-18,e.y-18,36,36);g.fillStyle='#544a58';g.fillRect(e.x-9,e.y-9,18,18)}for(const e of air)poly(e.x,e.y,[[-23,-9],[0,-18],[23,-9],[12,16],[0,8],[-12,16]],'#ef7caa');if(boss&&boss.hp>0){poly(boss.x,boss.y,[[-65,0],[-35,-35],[35,-35],[65,0],[35,35],[-35,35]],'#b6a1f2');g.fillStyle='#ff6c8b';g.fillRect(boss.x-45,boss.y-48,90*boss.hp/45,5)}for(const s of shots){g.fillStyle='#a5faff';g.fillRect(s.x-2,s.y-10,4,18)}for(const b of bombs){g.strokeStyle='#ffd86b';g.lineWidth=3;g.beginPath();g.arc(b.x,b.y,b.life>15?10:48*(1-b.life/30),0,7);g.stroke()}for(const h of hostile){g.fillStyle='#ff875f';g.beginPath();g.arc(h.x,h.y,5,0,7);g.fill()}if(inv<=0||Math.floor(inv/5)%2===0){poly(p.x,p.y,[[0,-24],[23,17],[7,10],[0,19],[-7,10],[-23,17]],'#eee8ff');poly(p.x,p.y,[[0,-16],[7,5],[-7,5]],'#8ce7ff');poly(p.x,p.y,[[0,29],[6,14],[-6,14]],'#ffb04b')}g.strokeStyle='#fff5a8';g.lineWidth=1;g.strokeRect(p.x-12,p.y-112,24,24);hud.textContent='SCORE '+score+'　残機 '+lives+'　'+(boss?'BOSS':'STAGE 1');if(mode!=='play'){g.fillStyle='#100b25cc';g.fillRect(0,0,480,640);g.textAlign='center';g.fillStyle='#ffe9ac';g.font='bold 32px system-ui';g.fillText(mode==='ready'?'GALAXY SHOOTER':mode==='clear'?'MISSION CLEAR!':'GAME OVER',240,290);g.font='18px system-ui';g.fillText('スタート / リトライを押してね',240,335);g.textAlign='start'}}function loop(now){let d=last?Math.min(2,(now-last)/16.67):1;last=now;step(d);draw();requestAnimationFrame(loop)}const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:
