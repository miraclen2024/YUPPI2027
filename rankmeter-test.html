<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>API接続テスト</title><style>body{font:16px system-ui;background:#171331;color:#fff;max-width:850px;margin:30px auto;padding:16px}button,select{font:inherit;padding:10px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#302448;padding:16px}a{color:#ffe7aa}</style></head><body><h1>ランクメーター API接続テスト</h1><p>ブラウザからの接続確認のみ。データの保存・転載は行いません。</p><label>対象月 <select id="month"><option>7</option><option>8</option><option>9</option><option>10</option><option selected>11</option></select></label> <button id="run">3種類の締め時間をテスト</button><pre id="out" aria-live="polite">ボタンを押してください。</pre><a href="./rankmeter.html">ランクメーターへ戻る</a><script>document.getElementById('run').onclick=async function(){this.disabled=true;const out=document.getElementById('out');out.textContent='';const month=document.getElementById('month').value;for(const close of [13,22,24]){out.textContent+=close+'時締め：確認中…\n';const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);try{const u=new URL('https://haishin-lab.com/wp-json/haishin-lab/v1/rank-borders');u.search=new URLSearchParams({year:'2026',month,close_time:String(close),sub_meter:'0'});const res=await fetch(u,{mode:'cors',credentials:'omit',signal:c.signal});if(!res.ok)throw Error('HTTP '+res.status);const j=await res.json();if(j.success!==true||!Array.isArray(j.data))throw Error('JSON形式不一致');const valid=j.data.every(x=>x.year===2026&&x.month===Number(month)&&x.close_time===close&&x.sub_meter===0&&x.borders&&typeof x.borders==='object');if(!valid)throw Error('応答条件不一致');out.textContent+='成功：HTTP '+res.status+' / JSON '+j.data.length+'件 / 条件一致\n\n'}catch(e){out.textContent+='失敗：'+e.message+'（CORS・通信障害・タイムアウト等の可能性）\n\n'}finally{clearTimeout(timer)}}this.disabled=false}</script></body></html>
